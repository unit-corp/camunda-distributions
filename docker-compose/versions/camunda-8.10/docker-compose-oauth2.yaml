# While the Docker images themselves are supported for production usage,
# this docker-compose.yaml is designed to be used by developers to run
# an environment locally. It is not designed to be used in production.
# We recommend to use Kubernetes in production with our Helm Charts:
# https://docs.camunda.io/docs/self-managed/setup/install/
# For local development, we recommend using KIND instead of `docker-compose`:
# https://docs.camunda.io/docs/self-managed/setup/deploy/local/local-kubernetes-cluster/

# This is a lightweight configuration with Orchestration (Zeebe + Operate + Tasklist), Connectors, and Keycloak for OAuth2/OIDC.
# See docker-compose-full.yaml for a configuration that also includes Optimize, Identity, and Hub.
# Camunda 8.10 no longer bundles Elasticsearch in the Docker Compose distribution.
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Consolidated Zeebe + Operate + Tasklist - https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#zeebe
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS="-XX:+PrintFlagsFinal"
      - CAMUNDA_SECRETS_STORES_FILE_DEFAULT_PATH=${CAMUNDA_SECRETS_STORES_FILE_DEFAULT_PATH:-/etc/camunda/secrets}
      - HOST=${HOST}
      - KEYCLOAK_HOST=keycloak
      - ORCHESTRATION_CLIENT_ID=${ORCHESTRATION_CLIENT_ID}
      - ORCHESTRATION_CLIENT_SECRET=${ORCHESTRATION_CLIENT_SECRET}
    env_file:
      - path: .env
        required: true
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - orchestration:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./driver-lib:/driver-lib:ro
      - ./secrets:/etc/camunda/secrets:ro
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # Camunda Connectors - executes outbound and inbound connector logic
  # Docs: https://docs.camunda.io/docs/self-managed/connectors-deployment/connectors-configuration/
  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}
    container_name: connectors
    ports:
      - "8086:8080"
    environment:
      - CONNECTORS_CLIENT_ID=${CONNECTORS_CLIENT_ID}
      - CONNECTORS_CLIENT_SECRET=${CONNECTORS_CLIENT_SECRET}
      - KEYCLOAK_HOST=keycloak
    env_file:
      - connector-secrets.txt
      - path: .env
        required: true
    mem_limit: 512m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    configs:
      - source: connectors-config
        target: /application.yaml
    networks:
      - camunda
    depends_on:
      orchestration:
        # Wait for orchestration service to be healthy, otherwise we get a lot of noisy logs from connection errors
        condition: service_healthy

  keycloak:
    image: camunda/keycloak:${KEYCLOAK_SERVER_VERSION}
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
      - --spi-admin--allowed-system-variables=ORCHESTRATION_CLIENT_SECRET,CONNECTORS_CLIENT_SECRET
    ports:
      - "18080:18080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: dev-file
      ORCHESTRATION_CLIENT_SECRET: ${ORCHESTRATION_CLIENT_SECRET}
      CONNECTORS_CLIENT_SECRET: ${CONNECTORS_CLIENT_SECRET}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 18080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_TRANSACTION_XA_ENABLED: "false"
    restart: on-failure
    volumes:
      - keycloak-data:/opt/keycloak/data
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/camunda-platform-realm.json
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          timeout 5 cat <&3 | grep -q '200 OK'
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s
    networks:
      - camunda

volumes:
  orchestration:
  camunda-data:
  keycloak-data:

networks:
  camunda:
    name: camunda

configs:
  connectors-config:
    file: ./.connectors/application.yaml

  orchestration-config:
    file: ./.orchestration/application-oauth2.yaml

  keycloak-realm:
    file: ./.keycloak/orchestration-connectors-realm.json
